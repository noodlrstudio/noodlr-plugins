[package]
name = "noodlr-clack-polysynth"
version = "2.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "noodlr's curated WCLAP polysynth, built on Clack."

[lib]
crate-type = ["cdylib"]

[dependencies]
clack-plugin = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d" }
clack-extensions = { git = "https://github.com/prokopyl/clack", rev = "27ca28391b57a61bad4bb5099288a7bf9247350d", features = ["audio-ports", "clack-plugin", "note-ports", "params", "state"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
