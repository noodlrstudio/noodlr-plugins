# Publishes packages/mcp/server.json to the official MCP Registry as
# io.github.noodlrstudio/noodlr.
#
# Run it from the Actions tab (Publish to MCP Registry → Run workflow) after
# the matching @noodlrstudio/mcp version is on npm. GitHub's OIDC token proves
# the run comes from the noodlrstudio organization, so no secrets are needed.
# The interactive `mcp-publisher login github` can't do that: it only sees the
# personal account.
name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
      # From registry_1.8.9_checksums.txt in that release.
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check server.json matches the published npm package
        run: |
          name=$(node -p 'require("./server.json").name')
          version=$(node -p 'require("./server.json").version')
          package=$(node -p 'require("./server.json").packages[0].identifier')
          package_version=$(node -p 'require("./server.json").packages[0].version')
          published=$(npm view "$package@$package_version" version)
          mcp_name=$(npm view "$package@$package_version" mcpName)
          echo "server $name@$version → npm $package@$published (mcpName $mcp_name)"
          [ "$published" = "$package_version" ] || { echo "::error::$package@$package_version is not on npm yet; publish it first."; exit 1; }
          [ "$mcp_name" = "$name" ] || { echo "::error::$package@$package_version has mcpName '$mcp_name', expected '$name'."; exit 1; }

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
