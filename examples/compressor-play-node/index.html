<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compressor preview</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 1rem;
        background: var(--noodlr-surface-canvas);
        color: var(--noodlr-text-primary);
        font-family: system-ui, sans-serif;
      }
      #toolbar {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        font-size: 0.8rem;
        color: var(--noodlr-text-secondary);
      }
      #toolbar button {
        font: inherit;
        padding: 0.35rem 0.7rem;
        border-radius: 0.5rem;
        border: 1px solid var(--noodlr-border-strong);
        background: var(--noodlr-surface-2);
        color: var(--noodlr-text-primary);
        cursor: pointer;
      }
      #node {
        background: var(--noodlr-surface-1);
        border: 1px solid var(--noodlr-border);
        border-radius: 1rem;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="toolbar"></div>
    <div id="node"></div>
    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
